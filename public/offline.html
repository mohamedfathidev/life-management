<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#3F7D7A">
    <title>غير متصل — إدارة الحياة</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            background: #F7F7F5; color: #2B2B2B; text-align: center; padding: 24px;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #15191A; color: #EDEDEA; }
        }
        .card { max-width: 360px; }
        .icon { font-size: 56px; margin-bottom: 12px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #767676; margin: 0 0 20px; line-height: 1.7; }
        button {
            background: #3F7D7A; color: #fff; border: 0; border-radius: 10px;
            padding: 10px 22px; font-size: 15px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📴</div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>محتاج اتصال بالشبكة عشان تفتح الصفحة دي. تأكد من اتصالك وحاول تاني.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
